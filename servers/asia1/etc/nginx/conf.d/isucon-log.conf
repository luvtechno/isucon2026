log_format isu_ltsv 'time:$time_iso8601\tmsec:$msec\tmethod:$request_method\turi:$request_uri\tstatus:$status\tbytes:$body_bytes_sent\treqbytes:$request_length\treqtime:$request_time\tuptime:$upstream_response_time\tua:$http_user_agent\tcc:$http_x_country_code\tip:$http_x_client_ip\tra:$remote_addr';
access_log /var/log/nginx/access.ltsv isu_ltsv;
